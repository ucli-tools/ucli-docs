# MkDocs Configuration for UCLI Tools Documentation
strict: true
site_name: UCLI Tools
site_description: Professional CLI tools for developers
site_author: UCLI Tools Team
site_url: https://docs.ucli.tools/

# Repository
repo_name: ucli-tools/ucli-docs
repo_url: https://github.com/ucli-tools/ucli-docs
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 UCLI Tools - Apache 2.0 License

# Theme
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/circle-half-full
        name: Switch colour theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/circle-half-full
        name: Switch colour theme

  font: false

  logo: ucli-kit/mark.svg
  favicon: ucli-kit/mark.svg

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      title: On this page

# The kit's README is not a page
exclude_docs: |
  ucli-kit/*.md

extra_css:
  - ucli-kit/tokens.css
  - ucli-kit/base.css
  - stylesheets/ucli-material.css

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

# Extra
extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://ucli.tools
      name: UCLI Tools Main Site
    - icon: fontawesome/brands/github
      link: https://github.com/ucli-tools
      name: UCLI Tools on GitHub
    - icon: fontawesome/solid/comments
      link: https://github.com/ucli-tools/community/discussions
      name: Join our community
    - icon: fontawesome/solid/download
      link: https://install.ucli.tools
      name: Install UCLI Tools

  version:
    provider: mike
    default: latest

  status:
    production: Production Ready
    planned: Coming Soon
    wip: Work in Progress

# Navigation
nav:
  - Home: index.md

  - Getting Started:
    - Introduction: getting-started/introduction.md
    - Installation: getting-started/installation.md

  - Tools:
    - ucli: tools/ucli.md
    - gits: tools/gits.md
    - mdtexpdf: tools/mdtexpdf.md
    - mdaudiobook: tools/mdaudiobook.md

  - Community:
    - Contact: community/contact.md
    - Contributing:
      - Contributing Guide: community/contributing.md
      - Code of Conduct: community/code-of-conduct.md
      - Security Policy: community/security.md
    - Development:
      - Architecture: development/architecture.md
      - Building Tools: development/building-tools.md
      - Testing: development/testing.md

